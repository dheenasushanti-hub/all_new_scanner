name: NIFTY 50 Persistent Thesis Position Manager v111.0.0

on:
  # The existing Cloudflare Worker controls dispatch cadence.
  workflow_dispatch:
    inputs:
      requeue_signal_key:
        description: >-
          Optional notification key to requeue only after manually checking
          Gmail and confirming that the message was not received.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nifty-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize scanner state with default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create runtime directories
        shell: bash
        run: mkdir -p state audit .cache

      - name: Determine IST session date
        id: session
        shell: bash
        run: echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore NSE instrument master cache
        uses: actions/cache@v4
        with:
          path: .cache/upstox_nse.json.gz
          key: upstox-nse-instrument-master-${{ runner.os }}-${{ steps.session.outputs.date }}
          restore-keys: |
            upstox-nse-instrument-master-${{ runner.os }}-


      - name: Requeue one manually verified uncertain alert (optional)
        if: ${{ inputs.requeue_signal_key != '' }}
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          STATE_FILE: state/market_state_v109.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse.json.gz
          REQUEUE_SIGNAL_KEY: ${{ inputs.requeue_signal_key }}
        shell: bash
        run: python market_scanner.py --requeue-notification "$REQUEUE_SIGNAL_KEY"

      - name: Run v111 market scan and claim queued notifications
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          STATE_FILE: state/market_state_v109.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse.json.gz
          NOTIFICATION_CLAIM_TOKEN: ${{ github.run_id }}:${{ github.run_attempt }}
          LOG_LEVEL: INFO
          SCANNER_DEBUG_AUDIT: "false"
        shell: bash
        run: |
          set -euo pipefail
          session_date="$(TZ=Asia/Kolkata date +%F)"
          python market_scanner.py --scan-and-claim 2>&1 | tee -a "audit/worker_${session_date}.log"

      # Commit the durable claim before contacting SMTP. A later run must not
      # resend a message whose delivery may already have been accepted.
      - name: Persist position state and notification claims before email
        id: persist_claims
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [[ ! -f state/market_state_v109.json ]] || git add -f -- state/market_state_v109.json
          audit_files=(audit/market_scan_*.jsonl audit/market_scan_diagnostics_*.jsonl audit/worker_*.log)
          if (( ${#audit_files[@]} > 0 )); then git add -f -- "${audit_files[@]}"; fi
          if git diff --cached --quiet; then
            echo "No pre-delivery state changes to persist."
            exit 0
          fi
          git commit -m "Persist NIFTY v109 position state and email claims"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            echo "::error::${DEFAULT_BRANCH} changed while this scanner run was executing."
            echo "::error::Refusing to merge durable trading state automatically."
            exit 1
          fi

      - name: Send only notifications claimed by this workflow attempt
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          STATE_FILE: state/market_state_v109.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse.json.gz
          NOTIFICATION_CLAIM_TOKEN: ${{ github.run_id }}:${{ github.run_attempt }}
        shell: bash
        run: python market_scanner.py --deliver-claimed

      - name: Persist final position and notification status
        if: ${{ always() && steps.persist_claims.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [[ ! -f state/market_state_v109.json ]] || git add -f -- state/market_state_v109.json
          audit_files=(audit/market_scan_*.jsonl audit/market_scan_diagnostics_*.jsonl audit/worker_*.log)
          if (( ${#audit_files[@]} > 0 )); then git add -f -- "${audit_files[@]}"; fi
          if git diff --cached --quiet; then
            echo "No final state changes to persist."
            exit 0
          fi
          git commit -m "Update NIFTY v109 position and notification status"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            echo "::error::${DEFAULT_BRANCH} changed before final notification state could be persisted."
            echo "::error::Refusing to merge durable trading state automatically."
            exit 1
          fi
