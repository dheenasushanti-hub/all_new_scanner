name: NIFTY 50 OI-First Position Manager v107.0.0

on:
  # The existing Cloudflare Worker controls dispatch cadence.
  workflow_dispatch:
    inputs:
      reconcile_position:
        description: >-
          First v107 deployment only. Enter 'flat' if no v106 advisory position
          is being tracked, or the exact v106 signal key you explicitly wish to
          recover. Never infer an actual brokerage holding from last_signal.
        required: false
        type: string
      requeue_signal_key:
        description: >-
          Optional notification key to requeue only after manually checking
          Gmail and confirming that the message was not received.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nifty-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create runtime directories
        shell: bash
        run: mkdir -p state audit .cache

      - name: Determine IST session date
        id: session
        shell: bash
        run: echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore NSE instrument master cache
        uses: actions/cache@v4
        with:
          path: .cache/upstox_nse.json.gz
          key: upstox-nse-instrument-master-${{ runner.os }}-${{ steps.session.outputs.date }}
          restore-keys: |
            upstox-nse-instrument-master-${{ runner.os }}-

      - name: Reconcile v106 advisory position (first deployment only)
        if: ${{ inputs.reconcile_position != '' }}
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          STATE_FILE: state/market_state_v107.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse.json.gz
          RECONCILE_POSITION: ${{ inputs.reconcile_position }}
        shell: bash
        run: python market_scanner.py --reconcile-position "$RECONCILE_POSITION"

      - name: Requeue one manually verified uncertain alert (optional)
        if: ${{ inputs.requeue_signal_key != '' }}
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          STATE_FILE: state/market_state_v107.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse.json.gz
          REQUEUE_SIGNAL_KEY: ${{ inputs.requeue_signal_key }}
        shell: bash
        run: python market_scanner.py --requeue-notification "$REQUEUE_SIGNAL_KEY"

      - name: Run v107 market scan and claim queued notifications
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          STATE_FILE: state/market_state_v107.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse.json.gz
          NOTIFICATION_CLAIM_TOKEN: ${{ github.run_id }}:${{ github.run_attempt }}
          OI_MATERIAL_THRESHOLD_PCT: "2.0"
          MIN_UNDERLYING_RR: "2.0"
          EXPECTED_OI_INTERVAL_SECONDS: "180"
          T1_PARTIAL_EXIT_PCT: "50"
          MAX_PREMIUM_LOSS_PCT: "20"
          PREMIUM_TRAILING_DRAWDOWN_PCT: "25"
          PREMIUM_DECAY_REVIEW_MINUTES: "15"
          PREMIUM_DECAY_MIN_LOSS_PCT: "12"
          NO_PROGRESS_MIN_SPOT_MOVE_ATR: "0.25"
          LOG_LEVEL: INFO
          SCANNER_DEBUG_AUDIT: "false"
        shell: bash
        run: |
          set -euo pipefail
          session_date="$(TZ=Asia/Kolkata date +%F)"
          python market_scanner.py --scan-and-claim 2>&1 | tee -a "audit/worker_${session_date}.log"

      # Commit the durable claim before contacting SMTP. A later run must not
      # resend a message whose delivery may already have been accepted.
      - name: Persist position state and notification claims before email
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [[ ! -f state/market_state_v107.json ]] || git add -f -- state/market_state_v107.json
          audit_files=(audit/market_scan_*.jsonl audit/market_scan_diagnostics_*.jsonl audit/worker_*.log)
          if (( ${#audit_files[@]} > 0 )); then git add -f -- "${audit_files[@]}"; fi
          if git diff --cached --quiet; then
            echo "No pre-delivery state changes to persist."
            exit 0
          fi
          git commit -m "Persist NIFTY v107 position state and email claims"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Send only notifications claimed by this workflow attempt
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          STATE_FILE: state/market_state_v107.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse.json.gz
          NOTIFICATION_CLAIM_TOKEN: ${{ github.run_id }}:${{ github.run_attempt }}
        shell: bash
        run: python market_scanner.py --deliver-claimed

      - name: Persist final position and notification status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [[ ! -f state/market_state_v107.json ]] || git add -f -- state/market_state_v107.json
          audit_files=(audit/market_scan_*.jsonl audit/market_scan_diagnostics_*.jsonl audit/worker_*.log)
          if (( ${#audit_files[@]} > 0 )); then git add -f -- "${audit_files[@]}"; fi
          if git diff --cached --quiet; then
            echo "No final state changes to persist."
            exit 0
          fi
          git commit -m "Update NIFTY v107 position and notification status"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
