name: NIFTY 50 Market Scanner v102

on:
  # Scheduling remains controlled by the existing Cloudflare Worker.
  workflow_dispatch:

permissions:
  contents: write

# Only one writer may update the durable state/audit at a time.
concurrency:
  group: nifty-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create runtime directories
        shell: bash
        run: mkdir -p state audit .cache

      - name: Determine IST session date
        id: session
        shell: bash
        run: echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore today's official NSE instrument master cache
        uses: actions/cache@v4
        with:
          path: .cache/upstox_nse.json.gz
          key: upstox-nse-instrument-master-${{ runner.os }}-${{ steps.session.outputs.date }}
          restore-keys: |
            upstox-nse-instrument-master-${{ runner.os }}-

      - name: Execute NIFTY scanner
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          STATE_FILE: state/market_state_v102.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse.json.gz
          OI_MATERIAL_THRESHOLD_PCT: "2.0"
          EXPECTED_OI_INTERVAL_SECONDS: "180"
          LOG_LEVEL: INFO
        shell: bash
        run: |
          set -o pipefail
          session_date="$(TZ=Asia/Kolkata date +%F)"
          python market_scanner.py 2>&1 | tee -a "audit/worker_${session_date}.log"

      - name: Persist scanner state and audit logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -f state/market_state_v102.json ]]; then
            git add -f -- state/market_state_v102.json
          fi
          state_backups=(state/market_state_v102.json.schema-*.backup)
          if (( ${#state_backups[@]} > 0 )); then
            git add -f -- "${state_backups[@]}"
          fi

          audit_files=(audit/market_scan_*.jsonl audit/worker_*.log)
          if (( ${#audit_files[@]} > 0 )); then
            git add -f -- "${audit_files[@]}"
          fi

          if git diff --cached --quiet; then
            echo "No state or audit changes to persist."
            exit 0
          fi

          git commit -m "Update NIFTY v102 scanner state and audit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
