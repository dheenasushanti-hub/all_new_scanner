name: NIFTY Predictive Market Scanner

on:
  # Scheduling is handled externally by the Cloudflare Worker.
  workflow_dispatch:

permissions:
  contents: write

# Prevent two Cloudflare-triggered scans from modifying scanner state
# at the same time.
concurrency:
  group: nifty-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install             --disable-pip-version-check             --no-input             --prefer-binary             -r requirements.txt

      - name: Run NIFTY predictive scanner
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          STATE_FILE: state/market_state.json
        run: python market_scanner_oct6_optimized.py

      - name: Persist scanner state
        if: always()
        run: |
          if [ ! -f state/market_state.json ]; then
            echo "No scanner state created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only create a commit when the scanner actually changed state.
          git add state/market_state.json

          if git diff --cached --quiet; then
            echo "No scanner state changes."
            exit 0
          fi

          git commit -m "Update NIFTY scanner state"

          # The workflow is serialized by concurrency, but rebase once
          # against the current branch before pushing to handle any
          # external repository update safely.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
