name: NIFTY Intraday OI Scanner v101

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Compute UTC instrument-master cache day
        id: cache_day
        shell: bash
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore official NSE instrument master cache
        id: instrument_cache
        uses: actions/cache@v4
        with:
          path: .cache/upstox_nse_instruments.json.gz
          key: nse-instrument-master-v101-${{ runner.os }}-${{ steps.cache_day.outputs.day }}
          restore-keys: |
            nse-instrument-master-v101-${{ runner.os }}-

      - name: Refresh master when creating today's cache
        if: steps.instrument_cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -f .cache/upstox_nse_instruments.json.gz

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input --prefer-binary -r requirements.txt

      - name: Validate configuration
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
          STATE_FILE: state/market_state_v101.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse_instruments.json.gz
          INSTRUMENT_CACHE_TTL_SECONDS: "86400"
          REFRESH_OPTION_QUOTES: "true"
        run: python market_scanner.py --check-config

      - name: Run NIFTY OI scanner
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_TOKEN: ${{ secrets.ALERT_WEBHOOK_TOKEN }}
          STATE_FILE: state/market_state_v101.json
          AUDIT_DIR: audit
          INSTRUMENT_CACHE_FILE: .cache/upstox_nse_instruments.json.gz
          INSTRUMENT_CACHE_TTL_SECONDS: "86400"
          REFRESH_OPTION_QUOTES: "true"
        run: python market_scanner.py

      - name: Persist scanner state and audit logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state/market_state_v101.json ]; then
            git add -f -- state/market_state_v101.json
          fi
          if compgen -G "audit/market_scan_*.jsonl" > /dev/null; then
            git add -f -- audit/market_scan_*.jsonl
          fi
          if git diff --cached --quiet; then
            echo "No state or audit changes to persist."
            exit 0
          fi
          git commit -m "Update v101 NIFTY scanner state and audit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
