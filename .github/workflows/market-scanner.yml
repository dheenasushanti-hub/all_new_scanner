name: NIFTY Predictive Market Scanner

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run predictive scanner
        env:
            UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
            EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
            EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
            EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        run: python market_scanner.py

      - name: Persist scanner state
        if: always()
        run: |
          if [ -f state/market_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state/market_state.json

            if git diff --cached --quiet; then
              echo "No scanner state changes."
            else
              git commit -m "Update scanner state"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin HEAD:"${GITHUB_REF_NAME}"
            fi
          else
            echo "No scanner state created."
          fi
